# LINE 風チャットアプリ: PostgreSQL + FastAPI(API/WebSocket) + Nginx(Web)
#
#   ブラウザ ──:80──> web(Nginx) ──/api, /uploads──> api(FastAPI:8000) ──> db(PostgreSQL:5432)
#
# 起動:   docker compose up -d --build
# 停止:   docker compose down          (DB データ・画像は残る)
# 全削除: docker compose down -v       (DB データ・画像も消える。スキーマ変更時はこれで作り直す)

services:
  db:
    image: postgres:16-alpine
    container_name: training-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - db-data:/var/lib/postgresql/data
      # 初回起動時のみ実行される初期化SQL
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    container_name: training-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@db:5432/${POSTGRES_DB:-appdb}
      # S3 からアクセスする場合に必要。カンマ区切りで複数指定可。研修用に既定は "*"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      UPLOAD_DIR: /app/uploads
      # 共有 DynamoDB モードで送った画像を置く S3 バケットの既定値 (設定画面に最初から入る)。
      # リージョンはテーブルと同じものを使う。ローカル (PostgreSQL) モードでは使わず api-uploads ボリュームに保存する。
      IMAGE_BUCKET: ${IMAGE_BUCKET:-handson-chat-images-255103685154}
    volumes:
      - api-uploads:/app/uploads        # 送信した画像の保存先
    ports:
      # S3 ホスティング版の画面から直接 API / WebSocket を使うために外へも公開する
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    container_name: training-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  api-uploads:
