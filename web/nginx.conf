# Nginx: 静的ファイル配信 + /api (REST/WebSocket) と /uploads (画像) を FastAPI へ中継
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;   # 画像アップロード (API 側は 5MB 制限)

    # REST API と WebSocket (/api/ws)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # WebSocket を切らない
    }

    # アップロード画像
    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # 実行時設定はキャッシュしない
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA: 存在しないパスは index.html を返す
    location / {
        try_files $uri $uri/ /index.html;
    }
}
